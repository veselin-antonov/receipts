# Every pull request, whatever it touches. Decides which checks the change
# needs, runs only those, and ends in `ci-summary`, which always reports.
#
# Path filters on a workflow skip it entirely, and a skipped workflow never
# reports a status, so a required check behind one would block every pull
# request that does not touch its paths. Filtering per job here instead, and
# requiring only ci-summary, avoids that: a check that was not needed counts
# as passed, one that ran must have passed.
#
# Pushes to master still go through api.yml and ui.yml, which publish images.
name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
      upload_limits: ${{ steps.filter.outputs.upload_limits }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide which checks this change needs
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -z "$BASE" ]]; then
            # workflow_dispatch: run everything
            files='*'
          else
            files="$(git diff --name-only "$BASE...$HEAD")"
          fi
          printf 'changed:\n%s\n' "$files"

          # A change to this workflow re-runs everything it gates.
          always='^\.github/workflows/ci\.yml$'
          matches() { [[ "$files" == '*' ]] || grep -qE "$1|$always" <<<"$files"; }
          flag() { if matches "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }

          flag api '^(api/|VERSION$|\.github/workflows/(api-checks|build-image)\.yml$)'
          flag ui '^(ui/|VERSION$|\.github/workflows/(ui-checks|build-image)\.yml$)'
          flag upload_limits '^(ui/nginx/|ui/DOCKERFILE$|api/src/main/resources/application\.yaml$|scripts/test-upload-limits\.sh$|\.github/workflows/upload-limits\.yml$)'
          flag e2e '^(api/|ui/|e2e/|VERSION$|\.github/workflows/e2e\.yml$)'
          cat "$GITHUB_OUTPUT"

  api-checks:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/api-checks.yml

  ui-checks:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/ui-checks.yml

  # :pr-<n> images to click through against the dev stack (docs/DEV_SETUP.md,
  # "Testing a pull request"). A fork's pull request gets a read-only token and
  # cannot push packages, so only this repository's branches get them. Each one
  # runs only after its component's checks passed, so only when that component
  # changed.
  api-preview:
    needs: api-checks
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    # Puts the jar api-checks built and tested into the image, as api.yml does.
    uses: ./.github/workflows/build-image.yml
    with:
      component: api
      version: pr-${{ github.event.pull_request.number }}
      include_version: true
      include_latest: false
    secrets: inherit

  ui-preview:
    needs: ui-checks
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      component: ui
      version: pr-${{ github.event.pull_request.number }}
      include_version: true
      include_latest: false
    secrets: inherit

  # One comment per pull request listing the preview images this run built,
  # api, ui or both. Found again by its marker and edited on later pushes,
  # rather than adding a comment per push.
  comment-preview:
    needs: [api-preview, ui-preview]
    if: >-
      !cancelled() &&
      (needs.api-preview.result == 'success' || needs.ui-preview.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment with preview images
        uses: actions/github-script@v9
        env:
          API_BUILT: ${{ needs.api-preview.result == 'success' }}
          UI_BUILT: ${{ needs.ui-preview.result == 'success' }}
        with:
          script: |
            const marker = '<!-- receipts-preview-images -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const tag = `pr-${issue_number}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);

            const built = [
              ['api', process.env.API_BUILT === 'true'],
              ['ui', process.env.UI_BUILT === 'true'],
            ].filter(([, ok]) => ok).map(([component]) => component);

            const pulls = built.map((c) => `docker pull ghcr.io/${owner}/receipts-${c}:${tag}`);
            const envs = built.map((c) => `${c.toUpperCase()}_TAG=${tag}`).join(' ');

            const body = [
              marker,
              `🐳 **Preview images built for this PR** (${built.join(' + ')}, at ${sha}):`,
              '',
              '```bash',
              ...pulls,
              '```',
              '',
              `📦 **Tag:** \`${tag}\` - run it on the dev stack with \`${envs}\`, see docs/DEV_SETUP.md, "Testing a pull request".`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`updated comment ${existing.html_url}`);
            } else {
              const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info(`created comment ${data.html_url}`);
            }

  upload-limits:
    needs: changes
    if: needs.changes.outputs.upload_limits == 'true'
    uses: ./.github/workflows/upload-limits.yml

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml

  # The one check to mark required. Passes when every check this change needed
  # passed; a check that was skipped because it was not needed does not fail
  # it. The preview comment is left out: it is a convenience, not a check.
  ci-summary:
    if: always()
    needs: [changes, api-checks, ui-checks, api-preview, ui-preview, upload-limits, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed check to have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed="$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')"
          if [[ -n "$failed" ]]; then
            echo "::error::failed: $(tr '\n' ' ' <<<"$failed")"
            exit 1
          fi
