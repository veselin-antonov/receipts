name: Build Development Image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Gate the image on lint and tests, so a broken build cannot be published.
  checks:
    uses: ./.github/workflows/checks.yml

  build-dev:
    needs: checks
    uses: ./.github/workflows/build-image.yml
    with:
      version: dev
      tag_list: sha-${{ github.sha }}
      include_version: true
      include_latest: false
    secrets: inherit
