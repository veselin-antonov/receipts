# UI on master: checks, then publish ghcr.io/<owner>/receipts-ui:dev and
# :sha-<sha>. Pull requests, including their :pr-<n> preview image, are handled
# by ci.yml.
#
# Path-filtered, so an api-only change does not build the ui.
name: UI

on:
  push:
    branches: [master]
    paths:
      - 'ui/**'
      - 'VERSION'
      - '.github/workflows/ui.yml'
      - '.github/workflows/ui-checks.yml'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ui-checks.yml

  image:
    needs: checks
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      component: ui
      version: dev
      tag_list: sha-${{ github.sha }}
      include_version: true
      include_latest: false
    secrets: inherit

