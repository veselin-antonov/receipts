# Build and push one component's image. Reusable only: always called after
# that component's checks, in the same run.
#
# Image names are spelled out rather than derived from github.repository, which
# is now `receipts` for both. The deployment pulls
# ghcr.io/veselin-antonov/receipts-api and receipts-ui, so those names must not
# change.
name: Build Image (reusable)

on:
  workflow_call:
    inputs:
      component:
        description: 'api or ui'
        required: true
        type: string
      version:
        required: true
        type: string
      tag_list:
        description: 'Additional tags, one per line, raw values'
        required: false
        type: string
        default: ''
      include_version:
        required: false
        type: boolean
        default: true
      include_latest:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/receipts-${{ inputs.component }}
    steps:
      - name: Validate component
        run: |
          case "${{ inputs.component }}" in
            api|ui) ;;
            *) echo "component must be api or ui, got '${{ inputs.component }}'"; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v7

      # The api image copies a prebuilt jar; take the one api-checks tested.
      - name: Download api jar
        if: inputs.component == 'api'
        uses: actions/download-artifact@v8
        with:
          name: api-jar
          path: api/build/libs

      - name: Read VERSION
        id: app_version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag list
        id: tags
        shell: bash
        run: |
          if [ -z "${{ inputs.version }}" ]; then
            echo "Error: version input is required"
            exit 1
          fi

          {
            echo "tags<<EOF"

            if [ "${{ inputs.include_version }}" = "true" ]; then
              echo "type=raw,value=${{ inputs.version }}"
            fi

            if [ "${{ inputs.include_latest }}" = "true" ]; then
              echo "type=raw,value=latest"
            fi

            if [ -n "${{ inputs.tag_list }}" ]; then
              while IFS= read -r line; do
                [ -n "$line" ] && echo "type=raw,value=${line}"
              done <<< "${{ inputs.tag_list }}"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ steps.tags.outputs.tags }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.component }}
          file: ${{ inputs.component }}/${{ inputs.component == 'api' && 'Dockerfile' || 'DOCKERFILE' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.app_version.outputs.VERSION }}
          # Separate cache scopes, or the two images evict each other's layers.
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}
