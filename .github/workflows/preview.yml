name: Build Preview Image

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional override for version (e.g., 0.0.6)'
        required: false
        type: string

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag_list: ${{ steps.compute.outputs.tag_list }}
      primary_tag: ${{ steps.compute.outputs.primary_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute version and tags
        id: compute
        shell: bash
        run: |
          # Get version for build context
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version=$(node -pe "require('./package.json').version")
          fi

          # Determine primary tag (without version prefix)
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${{ github.event.pull_request.number }}" ]; then
            primary_tag="pr-${{ github.event.pull_request.number }}"
          else
            primary_tag="sha-${GITHUB_SHA:0:7}"
          fi

          # Output variables
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "primary_tag=${primary_tag}" >> "$GITHUB_OUTPUT"
          {
            echo "tag_list<<EOF"
            echo "${primary_tag}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-preview:
    needs: prepare
    uses: ./.github/workflows/build-image.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      tag_list: ${{ needs.prepare.outputs.tag_list }}
      include_version: false
      include_latest: false
    secrets: inherit

  comment-preview:
    needs: [prepare, build-preview]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comment with preview image
        uses: actions/github-script@v7
        with:
          script: |
            const tag = ${{ toJSON(needs.prepare.outputs.primary_tag) }};
            const image = `ghcr.io/${context.repo.owner}/${context.repo.repo}:${tag}`;

            const body = [
              '🐳 **Preview image built for this PR:**',
              '',
              '```bash',
              `docker pull ${image}`,
              '```',
              '',
              `📦 **Tag:** \`${tag}\``,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
