# API on master: checks, then publish ghcr.io/<owner>/receipts-api:dev and
# :sha-<sha>. Pull requests are checked by ci.yml.
#
# Path-filtered, so a ui-only change does not build the api. The shared
# workflow files are in the filter so that changing CI re-runs it.
name: API

on:
  push:
    branches: [master]
    paths:
      - 'api/**'
      - 'VERSION'
      - '.github/workflows/api.yml'
      - '.github/workflows/api-checks.yml'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/api-checks.yml

  # Gated on the checks, so a broken build cannot be published.
  image:
    needs: checks
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      component: api
      version: dev
      tag_list: sha-${{ github.sha }}
      include_version: true
      include_latest: false
    secrets: inherit
