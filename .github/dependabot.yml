# Routine version updates, monthly and grouped so they arrive as a few pull
# requests rather than one per dependency. Security fixes are separate: they
# are enabled in the repository settings and open as soon as an advisory lands.
#
# Each ecosystem gets one group for minor+patch; majors come individually,
# since those are the ones that need reading.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /api
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Measured worse on 2026-09-25: 5.20 cost 7 correct prices across the
      # fixture set (floor +/-2) and needs leptonica >= 1.83. A tess4j bump is a
      # scanning change; take it deliberately with a harness run, not monthly.
      # See the comment on tess4j in api/build.gradle.
      - dependency-name: net.sourceforge.tess4j:tess4j

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      ui-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
