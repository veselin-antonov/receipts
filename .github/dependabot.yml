# Routine version updates, monthly and grouped so they arrive as a few pull
# requests rather than one per dependency. Security fixes are separate: they
# are enabled in the repository settings and open as soon as an advisory lands.
#
# Each ecosystem gets one group for minor+patch; majors come individually,
# since those are the ones that need reading.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /api
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      ui-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
