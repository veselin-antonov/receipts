spring:
  mail:
    protocol: smtp
    properties.mail:
      smtp:
        auth: true
      debug: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}

# Local dev JWT keys: api/certs, gitignored, generated by scripts/dev-setup.sh.
# Relative to the working directory, which is api/ under bootRun. Deliberately
# not on the classpath, so the keys never end up in the jar (D10).
jwt:
  private-key: ${JWT_PRIVATE_KEY:file:./certs/private.pem}
  public-key: ${JWT_PUBLIC_KEY:file:./certs/public.pem}

# Local dev OCR configuration
# On Windows: install Tesseract from https://github.com/UB-Mannheim/tesseract/wiki
# and set TESSDATA_PATH to point to the tessdata directory
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://localhost:5173,http://localhost:5173,http://localhost:7863}
  ocr:
    data-path: ${TESSDATA_PATH:C:/Program Files/Tesseract-OCR/tessdata}
    language: ${OCR_LANGUAGE:eng+bul}
    debug-output-path: ${OCR_DEBUG_OUTPUT_PATH:./ocr-debug}

logging:
  level:
    org:
      springframework:
        data:
          mongodb:
            core:
              MongoTemplate: DEBUG
        ai:
          openai: DEBUG
    com.giffing.bucket4j.spring.boot.starter: DEBUG
    io.github.bucket4j: DEBUG
    dev.vasoft.homeapp.receipts.scanning: DEBUG

debug: true
