plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.vasoft.homeapp'
version = file('VERSION').text.trim()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

//dependencyManagement {
//    imports {
//        mavenBom 'org.springframework.ai:spring-ai-bom:1.0.6'
//    }
//}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Caching
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation 'com.github.ben-manes.caffeine:jcache:3.1.8'
    implementation 'javax.cache:cache-api:1.1.1'

    // Rate Limiting
    implementation 'com.giffing.bucket4j.spring.boot.starter:bucket4j-spring-boot-starter:0.13.0'

    // Env variables from .env file
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

//    // Spring AI for receipt scanning
//    implementation 'org.springframework.ai:spring-ai-openai-spring-boot-starter:1.1.0'
//    implementation 'org.springframework.ai:spring-ai-core:1.0.6'
//    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'

    compileOnly 'org.projectlombok:lombok:1.18.32'

    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testCompileOnly 'org.projectlombok:lombok:1.18.32'

    testAnnotationProcessor 'org.projectlombok:lombok:1.18.32'
}


// Define a task for building the Docker image
tasks.register('buildImage', Exec) {
    group = "Docker Images"
    description = "Builds docker image and tags them with :latest>"

    def repositoryName = providers.gradleProperty('repositoryName').getOrElse('')
    def ver = project.version.toString()

    commandLine 'docker', 'build', '-t', "ghcr.io/${repositoryName}:${ver}", '--build-arg', "VERSION=${ver}", '.'
}

tasks.register('tagImage', Exec) {
    group = "Docker Images"
    description = "Tags the versioned docker image with :latest>"
    dependsOn buildImage

    def repositoryName = providers.gradleProperty('repositoryName').getOrElse('')
    def ver = project.version.toString()

    commandLine 'docker', 'tag', "ghcr.io/${repositoryName}:${ver}", "ghcr.io/${repositoryName}:latest"

    doLast {
        println("Created images:")

        exec {
            commandLine 'docker', 'images'
        }
    }
}

tasks.register('publishVersionedImage', Exec) {
    group = "Docker Images"
    description = "Publishes the docker image with tag :\\<version\\>"
    dependsOn buildImage

    def repositoryName = providers.gradleProperty('repositoryName').getOrElse('')
    def ver = project.version.toString()
    def imageName = "ghcr.io/${repositoryName}:${ver}"

    doFirst {
        println("Pushing image: ${imageName}")
    }

    commandLine 'docker', 'push', imageName
}

// Define a task for publishing the Docker image with tag :latest
tasks.register('publishLatestImage', Exec) {
    group = "Docker Images"
    description = "Publishes the docker image with tag :latest"
    dependsOn tagImage

    def repositoryName = providers.gradleProperty('repositoryName').getOrElse('')
    def imageName = "ghcr.io/${repositoryName}:latest"

    doFirst {
        println("Pushing image: ${imageName}")
    }

    commandLine 'docker', 'push', imageName

}

// Define a task that combines both publish actions
tasks.register('publishImage') {
    group = "Docker Images"
    description = "Publishes the docker images with tags :\\<version\\> :latest"
    dependsOn publishVersionedImage, publishLatestImage
}