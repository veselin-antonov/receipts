# The production deployment: api + ui + mongo on one host, pinned to a
# release. Images are published by this repository's release workflow
# (.github/workflows/release.yml). Secrets and host paths come from .env beside
# this file; see example.env and README.md.
#
# Only the ui is published on the host, on UI_PORT (7820, the production block
# of ROADMAP M1b decision 21). The api and MongoDB are reachable only inside
# the stack.

# Fixed rather than taken from the directory name, so the containers, network
# and project are `receipts` wherever this file is copied to.
name: receipts

services:
  receipts-ui:
    # A release, never :dev or :latest (decision 16); a release raises it
    image: ghcr.io/veselin-antonov/receipts-ui:0.1.0
    container_name: receipts-ui
    restart: unless-stopped
    ports:
      - ${UI_PORT:-7820}:80
    environment:
      BACKEND_HOST: receipts-api:7002
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    depends_on:
      receipts-api:
        condition: service_healthy

  receipts-api:
    image: ghcr.io/veselin-antonov/receipts-api:0.1.0
    container_name: receipts-api
    restart: unless-stopped
    env_file:
      - .env
    # Set here, over .env: the stack's own addresses, not the operator's
    environment:
      SERVER_PORT: 7002
      MONGODB_HOST: receipts-db
      MONGODB_PORT: 27017
      # Log timestamps only; stored dates are UTC by construction
      TZ: ${TZ:-Europe/Sofia}
    depends_on:
      receipts-db:
        condition: service_healthy
    healthcheck:
      # Any HTTP answer, including the 401 for an anonymous status check,
      # means the api is serving (as in e2e/compose.yaml)
      test: ['CMD-SHELL', 'wget -S -O /dev/null http://127.0.0.1:7002/api/auth/status 2>&1 | grep -q "HTTP/1.1 401"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  receipts-db:
    # Pinned like dev, preview and e2e: `latest` would move production to the
    # next MongoDB major on any redeploy. Raise it deliberately.
    image: mongo:8.2
    container_name: receipts-db
    restart: unless-stopped
    command: ['--auth']
    volumes:
      - ${MONGODB_DATAPATH:?set MONGODB_DATAPATH in .env}:/data/db
    # Only read when the data directory is empty: they create the root user
    # the api logs in as. MONGO_INITDB_DATABASE also tells `make db-refresh`
    # which database to copy.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASS:?}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:?}
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
