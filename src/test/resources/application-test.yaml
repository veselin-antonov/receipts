# Test profile: makes the suite runnable on a fresh clone.
#
# Every value here exists because application.yaml has 12 placeholders with no
# defaults, and spring-dotenv reads a gitignored .env that CI does not have.
# Without this file, context startup fails on server.port=${SERVER_PORT} not
# parsing as an Integer, long before any assertion runs (defect D9).
#
# Nothing here connects anywhere. Mongo and SMTP values are syntactically valid
# and deliberately unreachable; tests that need them mock them.

spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: receipts-test
      authentication-database: admin
      username: test
      password: test
      auto-index-creation: false
  mail:
    host: localhost
    port: 1025
    username: test
    password: test

server:
  port: 0          # random free port; never collides with a running dev server

app:
  host-url: http://localhost:5173
  cors:
    allowed-origins: http://localhost:5173
  ocr:
    data-path: /usr/share/tesseract-ocr/5/tessdata
    language: eng
    debug-output-path: ''

